:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f8;
  --border:#e3e8ef; --border-strong:#cfd7e3;
  --text:#0f172a; --text-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --primary:#2563eb; --primary-600:#1d4ed8; --primary-weak:#e8f0fe; --primary-ring:rgba(37,99,235,.22);
  --danger:#dc2626; --danger-weak:#fef2f2; --warn:#b45309; --warn-weak:#fffbeb;
  --success:#15803d; --success-weak:#f0fdf4;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 1px 3px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05);
  --shadow-lg:0 20px 50px rgba(15,23,42,.18);
  --viewer-bg:#e6eaf1; --radius:12px; --radius-sm:8px;
  --header-h:64px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --surface-2:#0f1729; --surface-3:#18233b;
  --border:#1f2b44; --border-strong:#2c3b5a;
  --text:#e6ebf5; --text-2:#c3cce0; --muted:#8b98b3; --faint:#5d6b88;
  --primary:#4f8bff; --primary-600:#3b76f0; --primary-weak:#16264a; --primary-ring:rgba(79,139,255,.3);
  --danger:#f87171; --danger-weak:#2a1418; --warn:#fbbf24; --warn-weak:#2a2110;
  --success:#4ade80; --success-weak:#0f2418;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --viewer-bg:#070c18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100dvh}
body{font-family:"UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.app-header{height:var(--header-h);display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);
  border-bottom:1px solid var(--border);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#4f8bff);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.brand-mark svg{width:20px;height:20px}
.brand-title{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand-title span{color:var(--faint);font-weight:500;margin:0 4px}
.brand-title b{color:var(--primary)}
.ver{font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-weak);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.sec-tools{display:flex;justify-content:flex-end;gap:14px;margin:-2px 4px 10px}
.logo-prev{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff;margin-top:6px}
.logo-prev img{height:56px}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:hover{background:var(--surface-3);color:var(--text)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-ring)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.28)}
.btn.primary:hover{background:var(--primary-600)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.icon{width:36px;padding:0}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-weak)}
.btn[disabled]{opacity:.5;pointer-events:none}
.hdr-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.menu-m{display:none !important}
.sheet-actions{display:grid;gap:8px}
.sheet-actions .btn{height:46px;justify-content:flex-start;font-size:15px}

/* ---------- Layout ---------- */
.app-main{display:grid;grid-template-columns:40% 60%;grid-template-rows:minmax(0,1fr);height:calc(100% - var(--header-h));min-height:0;overflow:hidden}
.app-main>*{min-height:0;min-width:0}
.editor{overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--border);background:var(--bg);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;height:100%}
.editor-inner{max-width:720px;margin:0 auto;padding:20px 20px 28px}
.viewer{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;background:var(--viewer-bg)}

/* ---------- Trip type switch ---------- */
.switch-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-3);padding:4px;border-radius:11px;gap:4px}
.seg button{border:0;background:transparent;height:44px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.seg button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .seg button.active{background:var(--primary-weak)}
.seg button small{font-weight:500;color:var(--faint);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;height:30px;padding:0 12px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--border-strong)}
.chip.active{background:var(--primary-weak);border-color:var(--primary);color:var(--primary)}
.chip-label{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px;align-self:center}

/* ---------- Sections ---------- */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:12px;overflow:hidden}
.section-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.section-head:hover{background:var(--surface-2)}
.section-num{width:26px;height:26px;border-radius:8px;background:var(--primary-weak);color:var(--primary);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.section-title{font-weight:600;font-size:15px}
.section-meta{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.section-meta .badge-err{background:var(--danger-weak);color:var(--danger);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.section-chev{transition:transform .2s;color:var(--faint)}
.section.collapsed .section-chev{transform:rotate(-90deg)}
.section-body{padding:4px 16px 18px;border-top:1px solid var(--border)}
.section.collapsed .section-body{display:none}

/* ---------- Form fields ---------- */
.grid{display:grid;gap:12px 12px;margin-top:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:500;color:var(--text-2)}
.field .req{color:var(--danger);margin-left:2px}
.input,select.input,textarea.input{height:38px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-sm);padding:0 11px;width:100%;
  transition:border-color .15s,box-shadow .15s;min-width:0}
textarea.input{height:auto;padding:9px 11px;resize:vertical;min-height:80px}
.input:hover{border-color:var(--faint)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.input[readonly]{background:var(--surface-2);color:var(--muted)}
.input.money{text-align:right;font-variant-numeric:tabular-nums}
.input-wrap{position:relative}
.input-wrap .suffix{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;pointer-events:none}
.input-wrap .input.money{padding-right:30px}
.field.invalid .input{border-color:var(--danger);background:var(--danger-weak)}
.field.invalid .input:focus{box-shadow:0 0 0 3px rgba(220,38,38,.18)}
.field-msg{font-size:12px;color:var(--danger);display:none;align-items:flex-start;gap:5px}
.field.invalid .field-msg{display:flex}
.field-hint{font-size:12px;color:var(--muted)}
.inline-actions{display:flex;gap:6px;align-items:center}
.inline-actions .input{flex:1}
.link-btn{border:0;background:none;color:var(--primary);font-weight:500;font-size:12.5px;cursor:pointer;padding:0}
.link-btn:hover{text-decoration:underline}

.info-box{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-2);margin-top:12px}
.info-box svg{color:var(--primary);margin-top:1px}
.info-box.warn{background:var(--warn-weak);border-color:transparent;color:var(--warn)}
.info-box.warn svg{color:var(--warn)}
.info-box.err{background:var(--danger-weak);border-color:transparent;color:var(--danger)}
.info-box.err svg{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--primary-weak);color:var(--primary);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.term-preview{margin-top:12px;font-size:13px;color:var(--muted)}
.term-preview b{color:var(--text);font-weight:600}

/* Meals */
.meals{display:flex;gap:8px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-strong);border-radius:9px;height:38px;padding:0 12px;cursor:pointer;background:var(--surface);font-weight:500;color:var(--text-2);user-select:none}
.check input{width:16px;height:16px;accent-color:var(--primary);margin:0}
.check:has(input:checked){border-color:var(--primary);background:var(--primary-weak);color:var(--primary)}
.check.sm{height:28px;padding:0 6px;font-size:12px;border-radius:7px;gap:4px}
.check.sm input{width:14px;height:14px}

.calc-box{margin-top:14px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.calc-row{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;font-size:13px;border-top:1px solid var(--border);align-items:baseline}
.calc-row:first-child{border-top:0}
.calc-row .k{color:var(--muted)}
.calc-row .v{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.calc-row.total{background:var(--surface-2);font-weight:700}
.calc-row.total .v{font-weight:700;color:var(--primary)}
.explain{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.explain li{margin:2px 0}

/* Summary groups (multi-day) */
.mgrid{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:12px}
.mgrid>div{padding:9px 12px;border-top:1px solid var(--border);display:flex;align-items:center;font-size:13px}
.mgrid>div.h{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--muted);border-top:0;text-transform:none}
.mgrid .num{justify-content:flex-end;font-variant-numeric:tabular-nums;font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;height:32px}
.stepper button{width:30px;height:100%;border:0;background:var(--surface-2);cursor:pointer;color:var(--text-2);font-size:16px;line-height:1}
.stepper button:hover{background:var(--surface-3)}
.stepper input{width:38px;height:100%;border:0;text-align:center;background:var(--surface);font-weight:600;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{display:none}
.stepper.invalid{border-color:var(--danger)}
.muted{color:var(--muted)}
.days-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.days-table th{font-weight:600;color:var(--muted);text-align:left;padding:7px 4px;border-bottom:1px solid var(--border);font-size:11.5px;white-space:nowrap}
.days-table td{padding:5px 4px;border-bottom:1px solid var(--border);vertical-align:middle;font-variant-numeric:tabular-nums}
.days-table td.r,.days-table th.r{text-align:right}
.days-table .chk{display:flex;gap:4px}
.days-wrap{overflow-x:auto}
.details-toggle{margin-top:12px}

/* Repeating rows */
.rows{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row-card{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface-2);position:relative}
.row-card.invalid{border-color:var(--danger)}
.row-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row-idx{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1px 7px}
.row-head .spacer{flex:1}
.row-card .grid{margin-top:0;gap:8px}
.row-card .input{height:34px;font-size:13.5px}
.row-card .field>label{font-size:11.5px}
.row-sum{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}
.row-sum b{font-variant-numeric:tabular-nums}
.add-btn{width:100%;border:1.5px dashed var(--border-strong);background:transparent;border-radius:10px;height:40px;color:var(--primary);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.add-btn:hover{background:var(--primary-weak);border-color:var(--primary)}
.sub-title{font-weight:600;font-size:13.5px;margin-top:16px;display:flex;align-items:center;gap:8px}
.sub-title:first-child{margin-top:12px}

/* Summary card */
.summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:16px}
.sum-bar{position:sticky;bottom:12px;margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow);padding:8px 10px 8px 16px;cursor:pointer;font-variant-numeric:tabular-nums}
.sum-bar.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
.sum-bar{transition:opacity .18s,transform .18s}
.sum-bar .k{color:var(--muted);font-size:13px;margin-right:auto}
.sum-bar b{color:var(--primary);font-size:15px}
.badge-warn,.badge-ok{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
.badge-warn{background:var(--warn-weak);color:var(--warn)}.badge-ok{background:var(--success-weak);color:var(--success)}
.badge-warn svg,.badge-ok svg{width:14px;height:14px}
.summary h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;font-variant-numeric:tabular-nums}
.sum-row .k{color:var(--muted)}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--border);margin-top:8px;padding-top:10px}
.sum-total .k{font-weight:600}
.sum-total .v{font-size:22px;font-weight:700;color:var(--primary);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sum-words{font-size:12.5px;color:var(--muted);margin-top:2px;text-align:right}
.issues{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.issues-btn{border:0;background:var(--warn-weak);color:var(--warn);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.issues-btn.ok{background:var(--success-weak);color:var(--success);cursor:default}
.issues-list{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px;max-height:160px;overflow:auto}
.issues-list li{padding:4px 0;color:var(--text-2);cursor:pointer;display:flex;gap:6px}
.issues-list li::before{content:"•";color:var(--danger)}
.issues-list li:hover{color:var(--primary)}

/* ---------- Viewer ---------- */
.viewer-bar{height:52px;display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.viewer-bar .final{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--success);background:var(--success-weak);border-radius:999px;padding:4px 11px;margin-right:6px;white-space:nowrap}
.viewer-bar .final .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(21,128,61,.18)}
.viewer-bar .tag{font-size:12px;font-weight:700;border:1px solid var(--border-strong);border-radius:6px;padding:2px 7px;color:var(--text-2)}
.zoom-val{min-width:50px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--text-2)}
.viewer-bar .spacer{flex:1}
.viewer-scroll{flex:1;min-height:0;overflow:auto;padding:28px 24px 60px;overscroll-behavior:contain}
.page-stack{display:flex;flex-direction:column;align-items:center;gap:24px;margin:0 auto;width:max-content}
.page-info{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

/* ---------- Mobile tabs ---------- */
.mobile-tabs{display:none}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-back.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:16px}
.modal-head .btn{margin-left:auto}
.modal-body{padding:18px 20px;overflow:auto}
.modal-body p{margin:0 0 10px;color:var(--text-2)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{border:0;background:none;height:44px;padding:0 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-panel{display:none}.tab-panel.active{display:block}
.rate-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.rate-table th,.rate-table td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left}
.rate-table th{font-size:12px;color:var(--muted);font-weight:600}
.rate-table .input{height:34px}
.year-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warn-list{margin:8px 0 0 18px;padding:0;color:var(--text-2);font-size:13px}

/* ---------- Toast ---------- */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--text);color:var(--surface);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;display:flex;gap:8px;align-items:center;max-width:380px;animation:tin .2s ease-out}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* =========================================================
   DOKUMENT A4 (tisková podoba) – barvy jsou pevné, nezávislé na tématu
   ========================================================= */
.page{width:794px;height:1123px;background:#fff;color:#111827;box-shadow:0 2px 6px rgba(15,23,42,.12),0 14px 40px rgba(15,23,42,.14);
  position:relative;flex:none;font-family:"DocSans",Arial,sans-serif;font-size:12.5px;line-height:1.35;font-kerning:none;font-variant-ligatures:none;overflow:hidden}
.page-content{position:absolute;left:64px;right:64px;top:56px;bottom:64px;overflow:hidden}
.page-foot{position:absolute;left:64px;right:64px;bottom:30px;display:flex;justify-content:space-between;font-size:9.5px;color:#6b7280}
.page *{font-style:normal;letter-spacing:0;text-transform:none}
.d-block{margin-bottom:12px}
.d-head{border-bottom:1.5px solid #1f2937;padding-bottom:8px;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;min-height:52px}
.d-logo{height:50px;width:auto;display:block;margin-bottom:1px}
.d-school{font-weight:700;font-size:13.5px}
.d-addr{font-size:11.5px;color:#374151;margin-top:2px}
.d-title{font-weight:700;font-size:16px;margin:0 0 10px}
.d-kv{width:100%;border-collapse:separate;border-spacing:0}
.d-kv td{padding:3px 0;vertical-align:baseline}
.d-kv td.l{width:205px;color:#374151;white-space:nowrap}
.d-kv td.v{border-bottom:1px solid #9ca3af;padding-left:6px;font-weight:700}
.d-sec{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #1f2937;padding-bottom:4px;margin-bottom:7px}
.d-sec-t{font-weight:700;font-size:13.5px}
.d-sec-total{display:flex;gap:10px;align-items:baseline}
.d-sec-total .l{color:#374151}
.d-sec-total .v{font-weight:700;min-width:110px;text-align:right;font-size:13.5px}
.d-grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border-top:1px solid #c7cdd6;border-left:1px solid #c7cdd6}
.d-grid td{padding:5px 6px;border-right:1px solid #c7cdd6;border-bottom:1px solid #c7cdd6;vertical-align:middle}
.d-grid td.l{color:#374151;background:#f6f7f9;white-space:nowrap}
.d-grid td.v{font-weight:700}
.d-grid td.n{text-align:right;font-weight:700;white-space:nowrap}
.d-grid td.h{background:#eef0f3;font-weight:700;font-size:11px;color:#374151;text-align:center}
.d-grid .small{font-weight:400;font-size:10px;color:#6b7280}
.d-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border-top:1px solid #c7cdd6;border-left:1px solid #c7cdd6}
.d-table th{background:#eef0f3;border-right:1px solid #c7cdd6;border-bottom:1px solid #c7cdd6;padding:4px 6px;font-weight:700;font-size:11px;text-align:left;color:#374151;line-height:1.25}
.d-table td{border-right:1px solid #c7cdd6;border-bottom:1px solid #c7cdd6;padding:5px 6px;height:25px;vertical-align:middle;font-size:12px}
.d-table td.n,.d-table th.n{text-align:right}
.d-table td.c,.d-table th.c{text-align:center}
.d-table tfoot td{font-weight:700;background:#f6f7f9}
.d-note{font-size:11.5px;color:#374151;border-left:3px solid #9ca3af;padding:6px 10px;background:#f6f7f9;margin:0 0 12px}
.d-box{border:1px solid #6b7280;padding:9px 12px 8px}
.d-box-t{font-weight:700;font-size:13.5px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.d-box-t .num{font-weight:400;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.d-line{display:inline-block;border-bottom:1px solid #9ca3af;min-width:120px;font-weight:700;padding:0 4px;height:18px;vertical-align:bottom}
.d-fields{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.d-fields td{padding:4px 4px 2px;vertical-align:baseline}
.d-fields td.l{color:#374151;white-space:nowrap;width:92px}
.d-fields td.v{border-bottom:1px solid #9ca3af;font-weight:700}
.d-fields td.gap{width:18px}
.d-sign{height:28px}
.d-sign-cap{font-size:9.5px;color:#6b7280;text-align:center;padding-top:2px}
.d-empty{color:#9ca3af;font-weight:400}
.d-mini{font-size:10.5px;color:#6b7280}
.d-att-title{font-weight:700;font-size:15px;margin:0 0 4px}
.d-att-sub{font-size:11.5px;color:#374151;margin-bottom:14px}
.d-cont{font-size:11px;color:#6b7280;margin-bottom:6px}

/* Offscreen měřicí kontejner */
#measure{position:fixed;left:-20000px;top:0;pointer-events:none;z-index:-1}
#printArea{display:none}

/* ---------- Responzivita ---------- */
@media (max-width:1180px){
  .btn .t-hide{display:none}
  .btn.collapse-t{width:36px;padding:0}
}
@media (max-width:900px){
  :root{--header-h:58px}
  body{overflow:hidden}
  .app-header{padding:0 12px;gap:8px}
  .brand-sub{display:none}
  .brand-mark{width:34px;height:34px}
  .hdr-sep,.hide-m{display:none !important}
  .app-main{display:block;height:calc(100% - var(--header-h) - 64px - env(safe-area-inset-bottom))}
  .editor,.viewer{height:100%;border:0}
  body[data-view="editor"] .viewer{position:absolute;left:-200vw;width:100vw}
  body[data-view="preview"] .editor{display:none}
  .editor-inner{padding:14px 12px 30px}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .sum-bar{display:none}
  .viewer-scroll{padding:16px 10px 40px}
  .viewer-bar{padding:0 8px;gap:2px;overflow-x:auto}
  .viewer-bar .final span.t{display:none}
  .mobile-tabs{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;position:fixed;left:0;right:0;bottom:0;height:64px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--border);z-index:30;align-items:center}
  .mobile-tabs button{height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
  .mobile-tabs button.active{background:var(--primary-weak);color:var(--primary);border-color:var(--primary)}
  .mobile-tabs .m-total{font-weight:700;color:var(--primary);font-size:14px;padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .toasts{left:12px;right:12px;bottom:76px}
  .modal-back{padding:0;align-items:flex-end}
  .modal,.modal.wide{width:100%;max-height:92vh;border-radius:16px 16px 0 0}
}
@media (max-width:520px){
  .g2{grid-template-columns:1fr}
  .g2 .span2{grid-column:auto}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .brand-title{font-size:15px}
  .header-actions .btn:not(.keep-m){display:none}
  .header-actions .btn.menu-m{display:inline-flex !important}
  .viewer-bar .t-m{display:none}
  .mgrid{grid-template-columns:1fr .9fr .9fr}
}

/* ---------- Tisk ---------- */
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  body>*:not(#printArea){display:none !important}
  #printArea{display:block}
  #printArea .page{box-shadow:none;break-after:page;page-break-after:always;margin:0;width:210mm;height:297mm}
  #printArea .page:last-child{break-after:auto;page-break-after:auto}
}

</style>

  </nav>
</header>

      <button class="btn sm primary" data-act="pdf"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg><span class="t-m">Stáhnout PDF</span></button>
    </div>
    <div class="viewer-scroll" id="viewerScroll"><div class="page-stack" id="pageStack"></div><div class="page-info" id="pageInfo"></div></div>
  </section>
</main>

<script>
/* =========================================================

const Core = (() => {

  /* ---------- Výchozí konfigurace sazeb podle roku ----------
     Hodnoty jsou v haléřích. Sazby jsou oddělené od kódu – v aplikaci
     se upravují v Nastavení → Sazby stravného a ukládají se do prohlížeče. */
  const DEFAULT_RATES = {
    "2025": {
      year: 2025,
      rates: [14800, 22500, 35300],              // 5–12 h | >12–18 h | >18 h
      min:   [14800, 22500, 35300],

      under5: 0,                                 // stravné při cestě < 5 h (jen pokud ho zaměstnavatel určí)
      source: "Vyhláška MPSV č. 475/2024 Sb., § 176 zákoníku práce (zaměstnavatel odměňující platem)",
      note: "Historická konfigurace pro rok 2025."
    },
    "2026": {
      year: 2026,
      rates: [15500, 23600, 37000],
      min:   [15500, 23600, 37000],
      max:   [18500, 28400, 44200],
      reduction: [70, 35, 25],
      under5: 0,
      source: "Vyhláška MPSV č. 573/2025 Sb., § 176 zákoníku práce (zaměstnavatel odměňující platem – příspěvková organizace)",
      note: "Sazby převzaté z excelových vzorů školy (155 / 236 / 370 Kč). Odpovídají dolní hranici zákonného rozpětí pro rok 2026."
    }
  };

  const BANDS = [
    { key: "u5",    label: "kratší než 5 hodin" },
    { key: "5_12",  label: "5 až 12 hodin" },
    { key: "12_18", label: "déle než 12, nejdéle 18 hodin" },
    { key: "18",    label: "déle než 18 hodin" }
  ];

  /* ---------- Peníze ---------- */
  /** Převede text "1 255,50" / "45" / "45.5 Kč" na haléře. */
  function parseMoney(str) {
    const s = String(str ?? "").replace(/\s| /g, "").replace(/kč$/i, "").replace(",", ".");
    if (s === "") return { empty: true, ok: true, value: 0 };
    const m = /^(-)?(\d+)(?:\.(\d{1,2}))?$/.exec(s);
    if (!m) return { empty: false, ok: false, value: 0, error: "Neplatná částka" };
    const h = parseInt(m[2], 10) * 100 + (m[3] ? parseInt(m[3].padEnd(2, "0"), 10) : 0);
    const value = m[1] ? -h : h;
    if (value < 0) return { empty: false, ok: false, value, error: "Částka nesmí být záporná" };
    return { empty: false, ok: true, value };
  }
  /** Celé nezáporné číslo (počet nocí apod.). */
  function parseCount(str) {
    const s = String(str ?? "").trim();
    if (s === "") return { empty: true, ok: true, value: 0 };
    if (!/^\d+$/.test(s)) return { empty: false, ok: false, value: 0, error: "Zadejte celé nezáporné číslo" };
    return { empty: false, ok: true, value: parseInt(s, 10) };
  }
  /** Haléře → "1 255,50 Kč" */
  function fmtMoney(h, { unit = true, decimals = true } = {}) {
    if (h === null || h === undefined || Number.isNaN(h)) return "";
    const neg = h < 0; let a = Math.abs(h);
    const kc = Math.floor(a / 100), hal = a % 100;
    const kcStr = String(kc).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    let out = (neg ? "−" : "") + kcStr + (decimals ? "," + String(hal).padStart(2, "0") : "");
    return unit ? out + " Kč" : out;
  }
  /** Haléře → text pro input "1255,50" (bez mezer) */
  function moneyToInput(h) { return Math.floor(h / 100) + (h % 100 ? "," + String(h % 100).padStart(2, "0") : ""); }
  /** Zaokrouhlení na celé koruny (matematicky, 0,50 nahoru). */
  function roundWhole(h) { return Math.floor((h + 50) / 100) * 100; }
  /** rate (haléře) × procenta / 100 se zaokrouhlením na haléře (polovina nahoru). */
  function pctOf(h, pct) { return Math.floor((h * pct + 50) / 100); }

  /* ---------- Částka slovy (čeština) ---------- */
  const ONES_M = ["nula","jeden","dva","tři","čtyři","pět","šest","sedm","osm","devět","deset","jedenáct","dvanáct","třináct","čtrnáct","patnáct","šestnáct","sedmnáct","osmnáct","devatenáct"];
  const TENS = ["","","dvacet","třicet","čtyřicet","padesát","šedesát","sedmdesát","osmdesát","devadesát"];
  const HUND = ["","sto","dvě stě","tři sta","čtyři sta","pět set","šest set","sedm set","osm set","devět set"];
  /** 1–999 slovy; gender "m" (jeden, dva) | "f" (jedna, dvě) */
  function triple(n, gender) {
    const parts = [];
    const h = Math.floor(n / 100), r = n % 100;
    if (h) parts.push(HUND[h]);
    if (r) {
      let unit = (x) => {
        if (gender === "f" && x === 1) return "jedna";
        if (gender === "f" && x === 2) return "dvě";
        return ONES_M[x];
      };
      if (r < 20) parts.push(unit(r));
      else { parts.push(TENS[Math.floor(r / 10)]); if (r % 10) parts.push(unit(r % 10)); }
    }
    return parts.join(" ");
  }
  /** Tvar podstatného jména podle čísla: forms = [1, 2–4, 5+] */
  function plural(n, forms) {
    const r100 = n % 100, r10 = n % 10;
    if (n === 1) return forms[0];
    if (n >= 2 && n <= 4) return forms[1];
    if (n > 20 && r10 >= 2 && r10 <= 4 && !(r100 >= 12 && r100 <= 14)) return forms[1];
    return forms[2];
  }
  function intWords(n, gender) {
    if (n === 0) return "nula";
    const out = [];
    const mil = Math.floor(n / 1e6), th = Math.floor((n % 1e6) / 1000), rest = n % 1000;
    if (mil) out.push(triple(mil, "m") + " " + plural(mil, ["milion", "miliony", "milionů"]));
    if (th) out.push(triple(th, "m") + " " + plural(th, ["tisíc", "tisíce", "tisíc"]));
    if (rest) out.push(triple(rest, gender));
    return out.join(" ");
  }
  /** Haléře → "jeden tisíc dvě stě padesát pět korun českých" */
  function amountInWords(h) {
    if (h === null || h === undefined || h < 0) return "";
    const kc = Math.floor(h / 100), hal = h % 100;
    let s = intWords(kc, "f") + " " + plural(kc, ["koruna česká", "koruny české", "korun českých"]);
    if (hal) s += " a " + intWords(hal, "m") + " " + plural(hal, ["haléř", "haléře", "haléřů"]);
    return s;
  }

  /* ---------- Datum a čas ---------- */
  const isISODate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
  const isTime = (s) => /^([01]?\d|2[0-3]):[0-5]\d$/.test(s || "");
  const toDays = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
  const fromDays = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
  const minutesOf = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
  /** "2026-06-12" → "12.6.2026" (formát školních dokumentů) */
  function fmtDate(iso) { if (!isISODate(iso)) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d}.${m}.${y}`; }
  /** "08:00" → "8:00" */
  function fmtTime(t) { if (!isTime(t)) return ""; const [h, m] = t.split(":"); return `${parseInt(h, 10)}:${m}`; }
  function fmtDur(min) { const h = Math.floor(min / 60), m = min % 60; return m ? `${h} h ${m} min` : `${h} h`; }
  const WD = ["ne", "po", "út", "st", "čt", "pá", "so"];
  function weekday(iso) { return WD[new Date(iso + "T12:00:00Z").getUTCDay()]; }
  function dateRange(a, b) { const out = []; for (let i = toDays(a); i <= toDays(b); i++) out.push(fromDays(i)); return out; }

  /* ---------- Sazby ---------- */
  /** Vrátí konfiguraci sazeb pro rok; pokud chybí, nejbližší starší (nebo novější). */
  function ratesFor(allRates, year) {
    const years = Object.keys(allRates).map(Number).sort((a, b) => a - b);
    if (!years.length) return { cfg: null, exact: false };
    if (allRates[String(year)]) return { cfg: allRates[String(year)], exact: true };
    const older = years.filter((y) => y < year);
    const y = older.length ? older[older.length - 1] : years[0];
    return { cfg: allRates[String(y)], exact: false };
  }
  function bandOf(minutes) {
    if (minutes < 300) return 0;           // < 5 h
    if (minutes <= 720) return 1;          // 5 až 12 h (včetně)
    if (minutes <= 1080) return 2;         // > 12 až 18 h
    return 3;                              // > 18 h
  }
  /** Stravné pro jeden kalendářní den. */
  function dayMeal(minutes, meals, cfg) {
    const band = bandOf(minutes);
    const base = band === 0 ? (cfg.under5 || 0) : cfg.rates[band - 1];
    const pct = cfg.reduction[Math.max(0, band - 1)];
    const rawRed = pctOf(base, pct * meals);
    const reduction = Math.min(base, rawRed);            // stravné nikdy nesmí být záporné
    return { band, base, pct, meals, reduction, amount: base - reduction, capped: rawRed > base };
  }

  /** Hlavní výpočet stravného (jednodenní i vícedenní cesta). */
  function calcMeals(doc, allRates) {
    const res = { ok: false, missing: [], days: [], total: null, cfg: null, exact: false, summary: null };
    const { startDate, startTime, endDate, endTime } = doc;
    if (!isISODate(startDate)) res.missing.push("datum začátku");
    if (!isTime(startTime)) res.missing.push("čas začátku");
    const ed = doc.tripType === "single" ? (endDate || startDate) : endDate;
    if (!isISODate(ed)) res.missing.push("datum konce");
    if (!isTime(endTime)) res.missing.push("čas konce");
    if (res.missing.length) return res;
    const startAbs = toDays(startDate) * 1440 + minutesOf(startTime);
    const endAbs = toDays(ed) * 1440 + minutesOf(endTime);
    if (endAbs <= startAbs) { res.error = "Konec pracovní cesty musí být později než její začátek."; return res; }
    const dates = dateRange(startDate, ed);
    if (doc.tripType === "single" && dates.length > 1) { res.error = "Cesta přesahuje půlnoc – stravné se posuzuje po kalendářních dnech. Přepněte na vícedenní cestu."; res.crossesMidnight = true; return res; }
    if (doc.tripType === "multi" && dates.length < 2) { res.error = "Vícedenní cesta musí trvat alespoň dva kalendářní dny. Pro cestu v jednom dni zvolte jednodenní cestu."; return res; }
    const { cfg, exact } = ratesFor(allRates, parseInt(startDate.slice(0, 4), 10));
    if (!cfg) { res.error = "Chybí konfigurace sazeb stravného."; return res; }
    res.cfg = cfg; res.exact = exact;
    let total = 0;
    dates.forEach((date, i) => {
      let minutes, role;
      if (dates.length === 1) { minutes = minutesOf(endTime) - minutesOf(startTime); role = "single"; }
      else if (i === 0) { minutes = 1440 - minutesOf(startTime); role = "first"; }
      else if (i === dates.length - 1) { minutes = minutesOf(endTime); role = "last"; }
      else { minutes = 1440; role = "middle"; }
      const m = doc.meals[date] || {};
      const mealsCount = (m.b ? 1 : 0) + (m.o ? 1 : 0) + (m.v ? 1 : 0);
      const d = dayMeal(minutes, mealsCount, cfg);
      res.days.push({ date, role, minutes, ...d, flags: { b: !!m.b, o: !!m.o, v: !!m.v } });
      total += d.amount;
    });
    res.total = total; res.ok = true;
    if (dates.length > 1) {
      const first = res.days[0], last = res.days[res.days.length - 1], mids = res.days.slice(1, -1);
      const mealsSet = new Set(mids.map((d) => d.meals));
      res.summary = {
        first: { meals: first.meals, amount: first.amount },
        last: { meals: last.meals, amount: last.amount },
        middle: {
          count: mids.length,
          meals: mids.length ? (mealsSet.size === 1 ? mids[0].meals : null) : 0,
          amount: mids.reduce((s, d) => s + d.amount, 0),
          perDay: mids.length && new Set(mids.map((d) => d.amount)).size === 1 ? mids[0].amount : null
        }
      };
    }
    return res;
  }

  /* ---------- Jízdní výdaje ---------- */
  const tripIsEmpty = (t) => !["from", "to", "desc", "startTime", "endTime", "price"].some((k) => String(t[k] || "").trim() !== "");
  function routeText(t) {
    const a = (t.from || "").trim(), b = (t.to || "").trim(), d = (t.desc || "").trim();
    let r = a && b ? `${a} – ${b}` : (a || b);
    if (d) r = r ? `${r}, ${d}` : d;
    return r;
  }
  function sumList(list, key) {
    let s = 0, bad = false;
    for (const it of list) { const p = parseMoney(it[key]); if (!p.ok) bad = true; else s += p.value; }
    return { sum: s, bad };
  }

  /** Kompletní vyúčtování dokladu. */
  function calcAll(doc, settings) {
    const meals = calcMeals(doc, settings.rates);
    const trips = doc.trips.filter((t) => !tripIsEmpty(t));
    const tr = sumList(trips, "price");
    let lodging = 0, lodgingBad = false;
    if (doc.tripType === "multi") {
      for (const l of doc.lodging) {
        const n = parseCount(l.nights), p = parseMoney(l.price);
        if (!n.ok || !p.ok) { lodgingBad = true; continue; }
        lodging += n.value * p.value;
      }
    }
    const ex = sumList(doc.extras, "amount");
    const total = meals.ok ? meals.total + tr.sum + lodging + ex.sum : null;
    const payout = total === null ? null : (settings.rounding === "whole" ? roundWhole(total) : total);
    return {
      meals, trips, travel: tr.sum, travelBad: tr.bad, lodging, lodgingBad, extras: ex.sum, extrasBad: ex.bad,
      total, payout, rounding: payout === null ? 0 : payout - total,
      words: payout === null ? "" : amountInWords(payout)
    };
  }

  return { DEFAULT_RATES, BANDS, parseMoney, parseCount, fmtMoney, moneyToInput, roundWhole, pctOf, amountInWords,
    isISODate, isTime, toDays, fromDays, minutesOf, todayISO, fmtDate, fmtTime, fmtDur, weekday, dateRange,
    ratesFor, bandOf, dayMeal, calcMeals, tripIsEmpty, routeText, calcAll };
})();

<script>
/* =========================================================
   ŠestaApp – CESTÁK · lokální generátor PDF
   Vytváří vektorové PDF přímo z vykreslených stránek náhledu:
   - rámečky a výplně se kreslí podle skutečných rozměrů prvků,
   - text se sází vloženým písmem TrueType (CIDFontType2, Identity-H),

   ========================================================= */

    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

      const o = 12 + i * 16;

        const end = dv.getUint16(ends + s * 2), start = dv.getUint16(starts + s * 2);
        const delta = dv.getInt16(deltas + s * 2), ro = dv.getUint16(ranges + s * 2);

  /* ---------- Sběr kreslicích příkazů ze stránky ---------- */
  function collect(pageEl, fonts, images) {
    const pr = pageEl.getBoundingClientRect();
    const k = 595.28 / pr.width;                          // px → pt
    const H = 841.89;
    const ops = [];
    const used = { R: new Map(), B: new Map() };
    // 1) pozadí a rámečky
    const els = [pageEl, ...pageEl.querySelectorAll("*")];
    for (const el of els) {
      const cs = getComputedStyle(el);
      if (cs.display === "none" || cs.visibility === "hidden") continue;
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      const x = (r.left - pr.left) * k, y = (r.top - pr.top) * k, w = r.width * k, h = r.height * k;

        continue;

      if (bg) ops.push(`${rgb(bg)} rg ${num(x)} ${num(H - y - h)} ${num(w)} ${num(h)} re f`);

          range.setStart(node, m.index + i); range.setEnd(node, m.index + i + 1); return [ch, range.getBoundingClientRect()];
        });

          if (!rr.width) continue;

          const A = font.ascent / font.upem, D = -font.descent / font.upem;

            let g = font.cmap.get(cp);

          ops.push(`BT /F${fk} ${num(fsPt)} Tf ${rgb(col)} rg 1 0 0 1 ${num((rr.left - pr.left) * k)} ${num(H - baseline * k)} Tm <${hex}> Tj ET`);
        }
      }
    }
    return { ops, used };
  }

  async function fontObjects(w, font, name, usedMap) {
    const scale = 1000 / font.upem;
    const widths = font.adv.map((a) => Math.round(a * scale)).join(" ");

    const fileId = compressed
      ? w.add(`<</Length1 ${font.bytes.length}/Filter/FlateDecode>>`, compressed)
      : w.add(`<</Length1 ${font.bytes.length}>>`, font.bytes);

  }

  /** Vytvoří PDF (Uint8Array) ze seznamu prvků .page */

      const cw = Math.max(1, Math.round(nw * k)), ch = Math.max(1, Math.round(nh * k));

      const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cw, ch); g.drawImage(im.el, 0, 0, cw, ch);

      for (let i = 0, j = 0; i < px.length; i += 4) { rgbBytes[j++] = px[i]; rgbBytes[j++] = px[i + 1]; rgbBytes[j++] = px[i + 2]; }
      const z = await deflate(rgbBytes);
      const id = w.add(`<</Type/XObject/Subtype/Image/Width ${cw}/Height ${ch}/ColorSpace/DeviceRGB/BitsPerComponent 8${z ? "/Filter/FlateDecode" : ""}>>`, z || rgbBytes);

    for (const p of pages) {
      const raw = enc.encode(p.ops.join("\n"));
      const z = await deflate(raw);
      const content = z ? w.add("<</Filter/FlateDecode>>", z) : w.add("<<>>", raw);
      kids.push(w.add(`<</Type/Page/Parent ${pagesId} 0 R/MediaBox[0 0 595.28 841.89]/Resources<</Font<</FR ${fR} 0 R/FB ${fB} 0 R>>${xobj ? `/XObject<<${xobj}>>` : ""}>>/Contents ${content} 0 R>>`));
    }
    w.set(pagesId, `<</Type/Pages/Kids[${kids.map((k) => k + " 0 R").join(" ")}]/Count ${kids.length}>>`);
    w.set(catalog, `<</Type/Catalog/Pages ${pagesId} 0 R/Lang(cs-CZ)/ViewerPreferences<</DisplayDocTitle true>>>>`);
    const d = new Date(), pad = (n) => String(n).padStart(2, "0");
    const date = `D:${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    const info = w.add(`<</Title ${utf16hex(title)}/Producer ${utf16hex("ŠestaApp – CESTÁK")}/Creator ${utf16hex("ŠestaApp – CESTÁK")}/CreationDate(${date})>>`);
    return w.build(catalog, info);
  }

  return { fromPages, parseTTF, b64ToBytes };
})();

const emptyTrip = (date = "") => ({ id: uid(), mode: "", startDate: date, startTime: "", from: "", to: "", desc: "", endDate: date, endTime: "", price: "" });
function newDoc(type = "single") {

  };
}
/** Doplní chybějící pole (např. při načtení staršího JSON). */
function normalizeDoc(d) {
  const base = newDoc(d && d.tripType === "multi" ? "multi" : "single");
  const out = { ...base, ...(d || {}) };
  out.approval = { ...base.approval, ...(d.approval || {}) };
  out.cash = { ...base.cash, ...(d.cash || {}) };
  out.meals = d.meals && typeof d.meals === "object" ? d.meals : {};
  out.trips = Array.isArray(d.trips) ? d.trips.map((t) => ({ ...emptyTrip(), ...t, id: t.id || uid() })) : base.trips;
  out.lodging = Array.isArray(d.lodging) ? d.lodging.map((t) => ({ id: uid(), name: "", nights: "", price: "", ...t })) : base.lodging;
  out.extras = Array.isArray(d.extras) ? d.extras.map((t) => ({ id: uid(), desc: "", amount: "", ...t })) : base.extras;
  ["employee", "purpose", "location", "startDate", "startTime", "endDate", "endTime"].forEach((k) => { if (typeof out[k] !== "string") out[k] = ""; });
  if (!["skolni", "skoleni", "jina"].includes(out.eventType)) out.eventType = "skolni";
  return out;
}

/* =========================================================
   Validace
   ========================================================= */
function validate() {
  const I = [];   // {key, msg, kind:'req'|'bad', sec}
  const req = (key, val, msg, sec) => { if (!String(val ?? "").trim()) I.push({ key, msg, kind: "req", sec }); };
  req("employee", D.employee, "Doplňte jméno a příjmení zaměstnance.", 1);
  req("purpose", D.purpose, "Doplňte název a účel akce.", 1);
  req("location", D.location, "Doplňte lokalitu.", 1);
  if (!C.isISODate(D.startDate)) I.push({ key: "startDate", msg: "Vyberte datum začátku.", kind: "req", sec: 2 });
  if (!C.isTime(D.startTime)) I.push({ key: "startTime", msg: "Zadejte čas začátku – je potřeba pro výpočet stravného.", kind: "req", sec: 2 });
  if (!C.isISODate(eff.endDate())) I.push({ key: "endDate", msg: "Vyberte datum konce.", kind: "req", sec: 2 });
  if (!C.isTime(D.endTime)) I.push({ key: "endTime", msg: "Zadejte čas konce – je potřeba pro výpočet stravného.", kind: "req", sec: 2 });
  const m = K.meals;
  if (m.error) I.push({ key: m.crossesMidnight ? "endDate" : "endTime", msg: m.error, kind: "bad", sec: 2 });
  // jídla
  if (D.tripType === "multi") ["first", "last", "middle"].forEach((g) => { if (mealInputErr[g]) I.push({ key: "meals." + g, msg: "Počet jídel musí být celé číslo 0 až 3.", kind: "bad", sec: 3 }); });
  // jízdy
  D.trips.forEach((t, i) => {
    if (C.tripIsEmpty(t)) return;
    const n = `${i + 1}. jízda: `;
    const p = C.parseMoney(t.price);
    if (p.empty) I.push({ key: `trips.${i}.price`, msg: n + "chybí cena jízdenky.", kind: "bad", sec: 4 });
    else if (!p.ok) I.push({ key: `trips.${i}.price`, msg: n + p.error.toLowerCase() + ".", kind: "bad", sec: 4 });
    if (!C.routeText(t)) I.push({ key: `trips.${i}.from`, msg: n + "doplňte trasu (odkud, kam nebo popis).", kind: "bad", sec: 4 });
    if (!C.isTime(t.startTime)) I.push({ key: `trips.${i}.startTime`, msg: n + "chybí čas začátku jízdy.", kind: "bad", sec: 4 });
    if (!C.isTime(t.endTime)) I.push({ key: `trips.${i}.endTime`, msg: n + "chybí čas konce jízdy.", kind: "bad", sec: 4 });
    const sd = t.startDate || D.startDate, ed = t.endDate || sd;
    if (C.isISODate(sd) && C.isISODate(ed) && C.isTime(t.startTime) && C.isTime(t.endTime)) {
      if (C.toDays(ed) * 1440 + C.minutesOf(t.endTime) < C.toDays(sd) * 1440 + C.minutesOf(t.startTime))
        I.push({ key: `trips.${i}.endTime`, msg: n + "konec jízdy je před jejím začátkem.", kind: "bad", sec: 4 });
    }
    if (D.tripType === "multi" && !C.isISODate(t.startDate)) I.push({ key: `trips.${i}.startDate`, msg: n + "chybí datum začátku jízdy.", kind: "bad", sec: 4 });
  });
  if (D.tripType === "multi") D.lodging.forEach((l, i) => {
    const empty = !l.name.trim() && !String(l.nights).trim() && !String(l.price).trim();
    if (empty) return;
    const n = C.parseCount(l.nights), p = C.parseMoney(l.price);
    if (!n.ok) I.push({ key: `lodging.${i}.nights`, msg: `Ubytování ${i + 1}: ${n.error.toLowerCase()}.`, kind: "bad", sec: 5 });
    else if (n.empty) I.push({ key: `lodging.${i}.nights`, msg: `Ubytování ${i + 1}: doplňte počet nocí.`, kind: "bad", sec: 5 });
    if (!p.ok) I.push({ key: `lodging.${i}.price`, msg: `Ubytování ${i + 1}: ${p.error.toLowerCase()}.`, kind: "bad", sec: 5 });
    else if (p.empty) I.push({ key: `lodging.${i}.price`, msg: `Ubytování ${i + 1}: doplňte cenu za noc.`, kind: "bad", sec: 5 });
    const nd = tripDates().length - 1;
    if (n.ok && !n.empty && nd > 0 && n.value > nd) I.push({ key: `lodging.${i}.nights`, msg: `Ubytování ${i + 1}: počet nocí je vyšší než délka cesty (${nd}).`, kind: "bad", sec: 5 });
  });
  D.extras.forEach((x, i) => {
    if (!x.desc.trim() && !String(x.amount).trim()) return;
    const p = C.parseMoney(x.amount);
    if (!p.ok) I.push({ key: `extras.${i}.amount`, msg: `Vedlejší výdaj ${i + 1}: ${p.error.toLowerCase()}.`, kind: "bad", sec: 5 });
    else if (p.empty) I.push({ key: `extras.${i}.amount`, msg: `Vedlejší výdaj ${i + 1}: doplňte částku.`, kind: "bad", sec: 5 });
    if (!x.desc.trim()) I.push({ key: `extras.${i}.desc`, msg: `Vedlejší výdaj ${i + 1}: doplňte popis.`, kind: "bad", sec: 5 });
  });
  return I;
}

let sumObs = null;
function observeSummary() {
  const sum = $("#summary"), bar = $("#sumBar"); if (!sum || !bar || !("IntersectionObserver" in window)) return;
  if (sumObs) sumObs.disconnect();
  sumObs = new IntersectionObserver(([e]) => bar.classList.toggle("hidden", e.isIntersecting), { root: $("#editor"), threshold: 0 });
  sumObs.observe(sum);
}

/* ---------- Stravné – editor ---------- */
const MEAL_ORDER_ADD = ["o", "v", "b"];
function setMealCount(date, n) {
  const cur = { ...(D.meals[date] || {}) };
  let count = (cur.b ? 1 : 0) + (cur.o ? 1 : 0) + (cur.v ? 1 : 0);
  if (n > count) for (const k of MEAL_ORDER_ADD) { if (count >= n) break; if (!cur[k]) { cur[k] = true; count++; } }
  if (n < count) for (const k of [...MEAL_ORDER_ADD].reverse()) { if (count <= n) break; if (cur[k]) { cur[k] = false; count--; } }
  D.meals[date] = cur;
}
const mealCount = (date) => { const m = D.meals[date] || {}; return (m.b ? 1 : 0) + (m.o ? 1 : 0) + (m.v ? 1 : 0); };
function stepper(group, value, label) {
  return `<span class="stepper ${mealInputErr[group] ? "invalid" : ""}" data-f="meals.${group}"><button data-mstep="${group}|-1" aria-label="Méně">−</button><input data-mset="${group}" value="${value}" placeholder="${value === "" ? "různě" : ""}" inputmode="numeric" aria-label="${label}"><button data-mstep="${group}|1" aria-label="Více">+</button></span>`;
}
function mealChecks(date, sm = false) {
  const m = D.meals[date] || {};
  return [["b", "snídaně"], ["o", "oběd"], ["v", "večeře"]].map(([k, l]) =>
    `<label class="check ${sm ? "sm" : ""}"><input type="checkbox" data-meal="${date}|${k}" ${m[k] ? "checked" : ""}>${sm ? l.slice(0, 1).toUpperCase() : l}</label>`).join("");
}
function renderMealsEditor() {
  const box = $("#mealsEditor"); if (!box) return;
  const dates = tripDates();
  const cfgInfo = rateInfoHtml();
  if (D.tripType === "single") {
    const d = D.startDate;
    box.innerHTML = `${cfgInfo}<div class="lbl" style="margin-top:14px">Bezplatně poskytnutá jídla</div>
      <div class="meals" style="margin-top:6px">${C.isISODate(d) ? mealChecks(d) : '<span class="muted">Nejdřív vyberte datum cesty.</span>'}</div>
      <div class="field-hint" style="margin-top:6px">Počet jídel: <b>${C.isISODate(d) ? mealCount(d) : 0}</b> (do dokladu se uvádí počet)</div>`;
    return;
  }
  if (dates.length < 2) { box.innerHTML = cfgInfo + `<div class="info-box warn">${ico("alert")}<div>Pro nastavení jídel vyplňte platný termín vícedenní cesty.</div></div>`; return; }
  const first = dates[0], last = dates[dates.length - 1], mids = dates.slice(1, -1);
  const midCounts = new Set(mids.map(mealCount));
  const midVal = mids.length ? (midCounts.size === 1 ? mids.map(mealCount)[0] : "") : 0;
  const sm = K.meals.summary;
  const amt = (v) => (K.meals.ok ? C.fmtMoney(v) : "—");
  box.innerHTML = `${cfgInfo}
    <div class="mgrid">
      <div class="h">Skupina dní</div><div class="h">Obdržená jídla / den</div><div class="h num">Stravné</div>
      <div>První den <span class="muted" style="margin-left:6px">${C.fmtDate(first)}</span></div><div>${stepper("first", mealCount(first), "Jídla první den")}</div><div class="num">${amt(sm?.first.amount)}</div>
      <div>Poslední den <span class="muted" style="margin-left:6px">${C.fmtDate(last)}</span></div><div>${stepper("last", mealCount(last), "Jídla poslední den")}</div><div class="num">${amt(sm?.last.amount)}</div>
      <div>Ostatní dny <span class="muted" style="margin-left:6px">${mids.length}×</span></div><div>${mids.length ? stepper("middle", midVal, "Jídla ostatní dny") : '<span class="muted">—</span>'}</div><div class="num">${amt(sm?.middle.amount)}</div>
    </div>
    ${mids.length && midVal === "" ? `<div class="field-hint" style="margin-top:6px">Ostatní dny mají různý počet jídel. Změnou hodnoty nastavíte všem prostředním dnům stejný počet.</div>` : mids.length ? `<div class="field-hint" style="margin-top:6px">Hodnota „ostatní dny“ se nastaví hromadně všem ${mids.length} prostředním dnům.</div>` : ""}
    <button class="btn sm details-toggle" data-toggle-days>${ico(D.showDays ? "chev" : "eye")}${D.showDays ? "Skrýt podrobný přehled dní" : "Podrobný přehled jednotlivých dní"}</button>
    ${D.showDays ? daysTable(dates) : ""}`;
}
function daysTable(dates) {
  const byDate = Object.fromEntries((K.meals.days || []).map((d) => [d.date, d]));
  return `<div class="days-wrap"><table class="days-table"><thead><tr><th>Den</th><th>Délka</th><th>Jídla (S/O/V)</th><th class="r">Před krácením</th><th class="r">Krácení</th><th class="r">Stravné</th></tr></thead><tbody>
    ${dates.map((dt) => { const d = byDate[dt]; const [y, mo, da] = dt.split("-").map(Number); return `<tr><td style="white-space:nowrap">${da}.${mo}. <span class="muted">${C.weekday(dt)}</span></td><td style="white-space:nowrap">${d ? C.fmtDur(d.minutes) : "—"}</td>
      <td><div class="chk">${mealChecks(dt, true)}</div></td><td class="r">${d ? C.fmtMoney(d.base, { unit: false }) : "—"}</td><td class="r">${d ? (d.reduction ? "−" + C.fmtMoney(d.reduction, { unit: false }) : "0,00") : "—"}</td><td class="r" style="white-space:nowrap"><b>${d ? C.fmtMoney(d.amount) : "—"}</b></td></tr>`; }).join("")}
  </tbody></table></div>`;
}
function rateInfoHtml() {
  const y = C.isISODate(D.startDate) ? parseInt(D.startDate.slice(0, 4), 10) : new Date().getFullYear();
  const { cfg, exact } = C.ratesFor(settingsForCalc().rates, y);
  if (!cfg) return `<div class="info-box err">${ico("alert")}<div>Chybí konfigurace sazeb. Doplňte ji v Nastavení.</div></div>`;
  const r = cfg.rates.map((v) => C.fmtMoney(v, { decimals: v % 100 !== 0 })).join(" / ");
  const ov = D.rateOverride ? `<div style="margin-top:4px">Doklad používá sazby uložené v načteném souboru. <button class="link-btn" data-drop-override>Použít aktuální nastavení</button></div>` : "";
  return `<div class="info-box ${exact ? "" : "warn"}">${ico(exact ? "info" : "alert")}<div><b>Sazby ${cfg.year}:</b> ${r} <span class="muted">(5–12 h / 12–18 h / nad 18 h)</span>, krácení ${cfg.reduction.join(" / ")} % za jídlo.
    ${exact ? "" : `<br>Pro rok ${y} nejsou sazby nastavené – použity sazby roku ${cfg.year}. Ověřte je v Nastavení.`}${ov}</div></div>`;
}
function mealsCalcHtml() {
  const m = K.meals;
  if (!m.ok) {
    const why = m.error ? m.error : `Pro výpočet chybí: ${m.missing.join(", ")}.`;
    return `<div class="info-box warn">${ico("alert")}<div>${esc(why)} Stravné se v dokladu zatím nezobrazí.</div></div>`;
  }
  const bandLbl = ["kratší než 5 h", "5–12 h", "nad 12 do 18 h", "nad 18 h"];
  const roleLbl = { single: "", first: "první den", last: "poslední den", middle: "" };
  const items = m.days.map((d) => {
    let s = `<b>${C.fmtDate(d.date)}</b>${roleLbl[d.role] ? ` (${roleLbl[d.role]})` : ""}: ${C.fmtDur(d.minutes)} → pásmo ${bandLbl[d.band]} → ${C.fmtMoney(d.base)}`;
    if (d.band === 0 && !d.base) s += " – stravné nenáleží";
    if (d.meals) s += `; ${d.meals} ${d.meals === 1 ? "jídlo" : "jídla"} × ${d.pct} % = −${C.fmtMoney(d.reduction)}${d.capped ? " (krácení omezeno na výši stravného)" : ""}`;
    return `<li>${s} → <b>${C.fmtMoney(d.amount)}</b></li>`;
  });
  const lim = m.days.length > 12 ? items.slice(0, 3).concat([`<li>… a dalších ${m.days.length - 4} dní (viz podrobný přehled)</li>`], items.slice(-1)) : items;
  return `<div class="calc-box"><div class="calc-row total"><span class="k">Stravné celkem</span><span class="v">${C.fmtMoney(m.total)}</span></div></div>
    <ul class="explain">${lim.join("")}</ul>`;
}

/* ---------- Aktualizace vypočtených částí editoru ---------- */
function updateComputed() {
  K = C.calcAll(D, settingsForCalc());
  const tp = $("#termPrev"); if (tp) tp.textContent = termText() || "—";
  // délka cesty
  const di = $("#durInfo");
  if (di) {
    const dates = tripDates();
    let html = "";
    if (C.isISODate(D.startDate) && C.isISODate(eff.endDate()) && C.toDays(eff.endDate()) < C.toDays(D.startDate))
      html = `<div class="info-box err">${ico("alert")}<div>Datum konce je před datem začátku.</div></div>`;
    else if (dates.length) {
      let dur = "";
      if (C.isTime(D.startTime) && C.isTime(D.endTime)) {
        const tot = (C.toDays(eff.endDate()) - C.toDays(D.startDate)) * 1440 + C.minutesOf(D.endTime) - C.minutesOf(D.startTime);
        if (tot > 0) dur = ` · celková doba ${C.fmtDur(tot)}`;
      }
      html = `<div class="term-preview"><span class="pill">${ico("check")}Počet dní akce: ${dates.length}</span> <span style="margin-left:6px">${dur.replace(" · ", "")}</span></div>`;
      if (D.tripType === "single" && dates.length > 1)
        html += `<div class="info-box warn">${ico("alert")}<div>Cesta končí v jiném dni než začala (přechod přes půlnoc). Stravné se posuzuje za každý kalendářní den zvlášť. <button class="link-btn" data-type="multi">Přepnout na vícedenní cestu</button></div></div>`;
    }
    di.innerHTML = html;
  }
  renderMealsEditor();
  const mc = $("#mealsCalc"); if (mc) mc.innerHTML = mealsCalcHtml();
  const setT = (id, v) => { const e = $(id); if (e) e.textContent = v; };
  setT("#tripSum", K.travelBad ? "zkontrolujte ceny" : C.fmtMoney(K.travel));
  setT("#lodgingSum", K.lodgingBad ? "zkontrolujte údaje" : C.fmtMoney(K.lodging));
  setT("#extrasSum", K.extrasBad ? "zkontrolujte částky" : C.fmtMoney(K.extras));
  D.lodging.forEach((l, i) => { const e = $(`#lodgingRow-${i}`); if (e) { const n = C.parseCount(l.nights), p = C.parseMoney(l.price); e.value = n.ok && p.ok && !n.empty && !p.empty ? C.fmtMoney(n.value * p.value) : ""; } });
  setT("#cashAmt", K.payout === null ? "— (doplňte údaje pro výpočet stravného)" : C.fmtMoney(K.payout));
  setT("#cashWords", K.words || "—");
  // recipient placeholder sync (pokud se přebírá automaticky)
  const rc = $("#f-cash\\.recipient"); if (rc && D.cash.recipient === null && document.activeElement !== rc) rc.value = D.employee;
  renderSummary();
  applyValidation();
  schedulePreview();
  scheduleAutosave();
  const mt = $("#mTotal"); if (mt) mt.textContent = K.payout === null ? "—" : C.fmtMoney(K.payout, { decimals: K.payout % 100 !== 0 });
}

function renderSummary() {
  const el = $("#summary"); if (!el) return;
  const issues = validate().filter((i) => i.key);
  const row = (k, v) => `<div class="sum-row"><span class="k">${k}</span><span>${v}</span></div>`;
  const multi = D.tripType === "multi";
  el.innerHTML = `<h3>${ico("check")}Celkové vyúčtování</h3>
    ${row("Celkem stravné", K.meals.ok ? C.fmtMoney(K.meals.total) : "—")}
    ${row("Celkem jízdní výdaje", C.fmtMoney(K.travel))}
    ${multi ? row("Celkem výdaje za ubytování", C.fmtMoney(K.lodging)) : ""}
    ${row("Celkem nutné vedlejší výdaje", C.fmtMoney(K.extras))}
    ${K.total !== null && K.rounding ? row("Zaokrouhlení na celé Kč", (K.rounding > 0 ? "+" : "") + C.fmtMoney(K.rounding)) : ""}
    <div class="sum-total"><span class="k">Částka k vyúčtování</span><span class="v">${K.payout === null ? "—" : C.fmtMoney(K.payout)}</span></div>
    <div class="sum-words">${esc(K.words)}</div>
    <div class="issues">${issues.length ? `<button class="issues-btn" data-issues>${ico("alert")}${issues.length} ${issues.length === 1 ? "upozornění" : issues.length < 5 ? "upozornění" : "upozornění"} k doplnění</button>
      <ul class="issues-list" id="issuesList" ${showIssues ? "" : "hidden"}>${issues.map((i) => `<li data-goto="${esc(i.key)}">${esc(i.msg)}</li>`).join("")}</ul>` :
      `<span class="issues-btn ok">${ico("check")}Doklad je kompletně vyplněný</span>`}</div>`;
  const bar = $("#sumBar");
  if (bar) bar.innerHTML = `<span class="k">Částka k vyúčtování</span><b>${K.payout === null ? "—" : C.fmtMoney(K.payout)}</b>${issues.length ? `<span class="badge-warn">${ico("alert")}${issues.length}</span>` : `<span class="badge-ok">${ico("check")}</span>`}`;
  // počty chyb a součty v hlavičkách sekcí
  const bySec = {}; issues.forEach((i) => { if (i.kind === "bad" || showAllErrors || touched.has(i.key)) bySec[i.sec] = (bySec[i.sec] || 0) + 1; });
  const metaVal = { 3: K.meals.ok ? C.fmtMoney(K.meals.total) : "", 4: C.fmtMoney(K.travel), 5: C.fmtMoney((multi ? K.lodging : 0) + K.extras), 7: K.payout === null ? "" : C.fmtMoney(K.payout) };
  SECTIONS.forEach(([n]) => { const m = $(`#meta-${n}`); if (m) m.innerHTML = `${bySec[n] ? `<span class="badge-err">${bySec[n]}</span>` : ""}${metaVal[n] || ""}`; });
}
let showIssues = false;

function applyValidation() {
  const issues = validate().filter((i) => i.key);
  $$(".field.invalid, .stepper.invalid, .row-card.invalid").forEach((f) => f.classList.remove("invalid"));
  for (const i of issues) {
    if (i.kind === "req" && !showAllErrors && !touched.has(i.key)) continue;
    const f = document.querySelector(`[data-f="${CSS.escape(i.key)}"]`);

/* =========================================================
   Události editoru
   ========================================================= */
function setPath(path, value) {
  const parts = path.split(".");
  let o = D;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}
function getPath(path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), D); }

function onInput(e) {
  const t = e.target;
  if (t.dataset.k) {
    const k = t.dataset.k;
    const val = t.type === "checkbox" ? t.checked : t.value;
    const prevStart = D.startDate;
    // pole s výchozími hodnotami z nastavení (null = výchozí)
    if (k === "approval.name") D.approval.name = val;
    else if (k.startsWith("cash.") && ["recipient", "cashier", "accountant", "approver"].includes(k.slice(5))) setPath(k, val);
    else setPath(k, val);
    if (k === "startDate") syncTripDates(prevStart);
    if (k === "startDate" && D.tripType === "single") { D.endDate = val; const ed = $("#f-endDate"); if (ed) ed.value = val; }
    if (k === "attachDetail") { /* jen náhled */ }
    touched.add(k);
    D.updatedAt = new Date().toISOString();
    updateComputed();
  } else if (t.dataset.meal) {
    const [date, m] = t.dataset.meal.split("|");
    D.meals[date] = { ...(D.meals[date] || {}), [m]: t.checked };
    updateComputed();
    restoreFocus(`[data-meal="${date}|${m}"]`);
  } else if (t.dataset.mset) {
    if (e.type !== "change" && t.value === "") return;
    const g = t.dataset.mset, v = t.value.trim();
    if (!/^[0-3]$/.test(v)) { mealInputErr[g] = true; renderSummary(); applyValidation(); t.closest(".stepper").classList.add("invalid"); return; }
    mealInputErr[g] = false;
    applyMealGroup(g, parseInt(v, 10));
    updateComputed();
    restoreFocus(`[data-mset="${g}"]`);
  }
}
function restoreFocus(sel) { const el = $(sel); if (el) { el.focus(); if (el.select && el.type !== "checkbox") el.select(); } }
function applyMealGroup(g, n) {
  const dates = tripDates(); if (dates.length < 2) return;
  if (g === "first") setMealCount(dates[0], n);
  else if (g === "last") setMealCount(dates[dates.length - 1], n);
  else dates.slice(1, -1).forEach((d) => setMealCount(d, n));
}
/** Při změně data začátku posune data jízd, která s ním souhlasila nebo byla prázdná. */
function syncTripDates(prev) {
  if (D.tripType !== "single") return;
  D.trips.forEach((t, i) => {
    ["startDate", "endDate"].forEach((f) => {
      if (!t[f] || t[f] === prev) { t[f] = D.startDate; const el = $(`#f-trips\\.${i}\\.${f}`); if (el) el.value = D.startDate; }
    });
  });
}

function onClick(e) {
  const b = e.target.closest("button, [data-goto], [data-toggle], [data-goto-summary]");
  if (!b) return;
  const ds = b.dataset;
  if (ds.gotoSummary !== undefined) { $("#summary").scrollIntoView({ behavior: "smooth", block: "end" }); return; }
  if (ds.expandAll !== undefined) { collapsed.clear(); $$(".section").forEach((x) => x.classList.remove("collapsed")); return; }
  if (ds.collapseAll !== undefined) { SECTIONS.forEach(([n]) => collapsed.add(n)); $$(".section").forEach((x) => x.classList.add("collapsed")); return; }
  if (ds.toggle) { const n = +ds.toggle; const s = $(`#sec-${n}`); s.classList.toggle("collapsed"); collapsed.has(n) ? collapsed.delete(n) : collapsed.add(n); return; }
  if (ds.type) { switchType(ds.type); return; }
  if (ds.event) { D.eventType = ds.event; renderEditor(); return; }
  if (ds.pickEmp !== undefined) { D.employee = ds.pickEmp; touched.add("employee"); const f = $("#f-employee"); if (f) f.value = D.employee; updateComputed(); return; }
  if (ds.add) { addRow(ds.add); return; }
  if (ds.del) { delRow(ds.del); return; }
  if (ds.return !== undefined) { addReturn(+ds.return); return; }
  if (ds.today) { setPath(ds.today, C.todayISO()); const f = $(`#f-${CSS.escape(ds.today)}`); if (f) f.value = C.todayISO(); updateComputed(); return; }
  if (ds.mstep) {
    const [g, d] = ds.mstep.split("|"); const dates = tripDates(); if (dates.length < 2) return;
    const cur = g === "first" ? mealCount(dates[0]) : g === "last" ? mealCount(dates[dates.length - 1]) : (() => { const c = dates.slice(1, -1).map(mealCount); return new Set(c).size === 1 ? c[0] : (+d > 0 ? Math.min(...c) : Math.max(...c)); })();
    const n = Math.max(0, Math.min(3, cur + +d)); mealInputErr[g] = false;
    applyMealGroup(g, n); updateComputed(); return;
  }
  if (ds.toggleDays !== undefined) { D.showDays = !D.showDays; updateComputed(); return; }
  if (ds.dropOverride !== undefined) { D.rateOverride = null; updateComputed(); toast("Použity sazby z aktuálního nastavení."); return; }
  if (ds.issues !== undefined) { showIssues = !showIssues; showAllErrors = true; renderSummary(); applyValidation(); return; }
  if (ds.goto) { gotoField(ds.goto); return; }
}
function gotoField(key) {
  showAllErrors = true; applyValidation();
  const f = document.querySelector(`[data-f="${CSS.escape(key)}"]`);
  if (!f) return;
  const sec = f.closest(".section"); if (sec && sec.classList.contains("collapsed")) { sec.classList.remove("collapsed"); collapsed.delete(+sec.dataset.sec); }
  if (document.body.dataset.view === "preview") setView("editor");
  f.scrollIntoView({ behavior: "smooth", block: "center" });

}
function switchType(type) {
  if (D.tripType === type) return;
  D.tripType = type;
  if (type === "single") { D.endDate = D.startDate; }
  else if (!C.isISODate(D.endDate) || D.endDate <= D.startDate) { if (C.isISODate(D.startDate)) D.endDate = C.fromDays(C.toDays(D.startDate) + 1); }
  renderEditor();
}
function addRow(kind) {
  if (kind === "trips") {
    const last = D.trips[D.trips.length - 1];
    const t = emptyTrip(D.tripType === "single" ? D.startDate : "");
    if (last && last.mode) t.mode = last.mode;
    D.trips.push(t);
  }
  if (kind === "lodging") D.lodging.push({ id: uid(), name: "", nights: "", price: "" });
  if (kind === "extras") D.extras.push({ id: uid(), desc: "", amount: "" });
  renderEditor();
  const cards = $$(`[data-row^="${kind}."]`); const lastCard = cards[cards.length - 1];
  if (lastCard) { lastCard.scrollIntoView({ behavior: "smooth", block: "center" }); const i = lastCard.querySelector("input:not([type=date]):not([type=time])"); if (i) setTimeout(() => i.focus({ preventScroll: true }), 250); }
}
async function delRow(path) {
  const [kind, idx] = path.split("."); const list = D[kind]; const item = list[+idx];
  const isEmpty = kind === "trips" ? C.tripIsEmpty(item) : kind === "lodging" ? !item.name && !item.nights && !item.price : !item.desc && !item.amount;
  if (!isEmpty && !(await confirmDialog({ title: "Odstranit řádek?", text: "Vyplněné údaje v tomto řádku budou odstraněny.", ok: "Odstranit", danger: true }))) return;
  list.splice(+idx, 1);
  if (kind === "trips" && !list.length) list.push(emptyTrip(D.tripType === "single" ? D.startDate : ""));
  if (kind === "extras" && !list.length) list.push({ id: uid(), desc: "", amount: "" });
  if (kind === "lodging" && !list.length) list.push({ id: uid(), name: "", nights: "", price: "" });
  renderEditor();
}
function addReturn(i) {
  const t = D.trips[i];
  const r = { ...emptyTrip(), mode: t.mode, from: t.to, to: t.from, desc: t.desc, price: t.price,
    startDate: D.tripType === "single" ? (t.startDate || D.startDate) : (C.isISODate(eff.endDate()) ? eff.endDate() : ""), endDate: D.tripType === "single" ? (t.endDate || D.startDate) : (C.isISODate(eff.endDate()) ? eff.endDate() : "") };
  // nahradí první prázdný řádek za aktuálním, jinak přidá nový
  const emptyIdx = D.trips.findIndex((x, j) => j > i && C.tripIsEmpty(x));

/* ---------- Stránkování do listů A4 ---------- */
function newPageEl() {
  const p = document.createElement("div"); p.className = "page";
  p.innerHTML = `<div class="page-content"></div><div class="page-foot"><span></span><span></span></div>`;
  return p;
}
const overflows = (content) => content.scrollHeight > content.clientHeight + 0.5;
function buildPages(target) {
  target.innerHTML = "";
  const blocks = docBlocks();
  let page = newPageEl(); target.appendChild(page);
  let content = page.firstElementChild;
  const nextPage = () => { page = newPageEl(); target.appendChild(page); content = page.firstElementChild; };
  const mk = (b) => { const el = document.createElement("div"); el.className = b.cls || ""; el.innerHTML = b.html; return el; };
  for (const b of blocks) {
    if (b.newPage && content.children.length) nextPage();
    const el = mk(b);
    content.appendChild(el);
    if (!overflows(content)) continue;
    content.removeChild(el);
    if (b.split && el.querySelector("tbody")) { splitTable(el, b); continue; }
    if (content.children.length) nextPage();
    content.appendChild(el);
  }
  function splitTable(el, b) {
    const rows = [...el.querySelectorAll("tbody > tr")];
    const shell = (cont) => {
      const s = el.cloneNode(true); s.querySelector("tbody").innerHTML = "";
      if (cont) { const c = document.createElement("div"); c.className = "d-cont"; c.textContent = b.contTitle || "pokračování"; const sec = s.querySelector(".d-sec"); if (sec) sec.replaceWith(c); else s.prepend(c); }
      return s;
    };
    let part = shell(false);
    content.appendChild(part);
    while (rows.length) {
      const tb = part.querySelector("tbody");
      const r = rows.shift(); tb.appendChild(r);
      if (!overflows(content)) continue;
      tb.removeChild(r); rows.unshift(r);
      if (!tb.children.length) {
        content.removeChild(part);
        if (!content.children.length) { content.appendChild(part); tb.appendChild(rows.shift()); continue; } // nevejde se ani na prázdnou stranu
        nextPage(); part = shell(false);                 // celý oddíl začne na nové straně
      } else { nextPage(); part = shell(true); }         // zbývající řádky pokračují
      content.appendChild(part);
    }
  }
  const pages = $$(".page", target);
  pages.forEach((p, i) => { const f = p.querySelector(".page-foot"); f.children[0].textContent = pages.length > 1 ? DOC_TITLES[D.tripType] : ""; f.children[1].textContent = pages.length > 1 ? `strana ${i + 1} / ${pages.length}` : ""; });
  return pages;
}

const ascii = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9-]+/g, "_").replace(/^_+|_+$/g, "");
function baseFileName() {
  const parts = D.employee.trim().split(/\s+/).filter(Boolean);
  const name = parts.length > 1 ? [parts[parts.length - 1], ...parts.slice(0, -1)].join("_") : (parts[0] || "doklad");
  const date = C.isISODate(D.startDate) ? D.startDate : C.todayISO();
  return `Cestak_${ascii(name) || "doklad"}_${date}`;
}
async function saveFile(filename, data, mime) {
  // V prostředí Claude artefaktu se použije schválené stažení; jinde klasické stažení prohlížeče.
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename, data: data instanceof Uint8Array ? new Blob([data], { type: mime }) : data }); return true; }
    } catch (e) { if (e && e.code === "declined") return false; }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
function rememberEmployee() {
  const n = D.employee.trim(); if (!n) return;

  if (!(await preflight("exportem PDF"))) { const first = validate().find((i) => i.key); if (first) gotoField(first.key); return; }
  const btns = $$("[data-act=pdf]"); btns.forEach((b) => (b.disabled = true));

    const back = $("#dlg");
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${esc(title)}</h2></div>
      <div class="modal-body">${html || `<p>${esc(text)}</p>`}</div>

    back.classList.add("open");
    const done = (v) => { back.classList.remove("open"); back.innerHTML = ""; document.removeEventListener("keydown", key); resolve(v); };
    const key = (e) => { if (e.key === "Escape") done(false); };
    document.addEventListener("keydown", key);

  });
}
