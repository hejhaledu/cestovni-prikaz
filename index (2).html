    ${["5 až 12 hodin", "déle než 12, nejdéle 18 hodin", "déle než 18 hodin"].map((l, i) => `<tr><td>${l}</td><td><input class="input money" data-rate="rates.${i}" value="${mi(cfg.rates[i])}"></td><td><input class="input money" data-rate="min.${i}" value="${mi(cfg.min[i] || 0)}"></td><td><input class="input money" data-rate="max.${i}" value="${mi(cfg.max[i] || 0)}"></td><td><div class="input-wrap"><input class="input money" data-rate="reduction.${i}" value="${cfg.reduction[i]}"><span class="suffix">%</span></div></td></tr>`).join("")}
    <tr><td>kratší než 5 hodin</td><td><input class="input money" data-rate="under5" value="${mi(cfg.under5 || 0)}"></td><td colspan="3" class="muted" style="font-size:12px">Stravné zpravidla nenáleží (0 Kč). Jinou částku zadejte, jen pokud ji zaměstnavatel určil; krácí se jako u pásma 5–12 h.</td></tr></tbody></table>
    ${warn.length ? `<div class="info-box warn">${ico("alert")}<div>${warn.join("<br>")}</div></div>` : ""}
    <div class="grid g2"><div class="field span2"><label>Právní zdroj</label><input class="input" data-rate="source" value="${esc(cfg.source || "")}"></div>
    <div class="field span2"><label>Poznámka</label><input class="input" data-rate="note" value="${esc(cfg.note || "")}"></div></div>
    <div class="info-box">${ico("info")}<div>Sazby se vybírají podle roku začátku pracovní cesty. Zákonné hodnoty se mění každoročně vyhláškou MPSV – před novým rokem doplňte nový rok podle platné vyhlášky. Pásma: 5–12 h včetně, nad 12 do 18 h včetně, nad 18 h; každý kalendářní den se posuzuje zvlášť.</div></div>` : ""}`;
}
function settingsInput(e) {
  const t = e.target;
  if (t.matches("[data-s-logo-show]")) { draftS.school.showLogo = t.checked; renderSettingsTab("school"); return; }
  if (t.dataset.s) {
    const k = t.dataset.s;
    if (k === "employees") draftS.employees = t.value.split("\n").map((x) => x.trim()).filter(Boolean);
    else if (k === "rounding") draftS.rounding = t.value;
    else { const [a, b] = k.split("."); draftS[a][b] = t.value; }
  }
  if (t.dataset.rate) {
    const cfg = draftS.rates[rateYearSel]; const [k, i] = t.dataset.rate.split(".");
    if (k === "source" || k === "note") { cfg[k] = t.value; return; }
    if (k === "reduction") { const v = parseInt(t.value, 10); t.classList.toggle("bad", isNaN(v)); if (!isNaN(v) && v >= 0 && v <= 100) cfg.reduction[+i] = v; return; }
    const p = C.parseMoney(t.value); t.style.borderColor = p.ok ? "" : "var(--danger)";
    if (p.ok) { if (k === "under5") cfg.under5 = p.value; else cfg[k][+i] = p.value; }
  }
}
async function settingsClick(e) {
  const b = e.target.closest("button, select"); const back = $("#settingsDlg");
  if (e.target === back) { back.classList.remove("open"); return; }
  if (!b) return;
  const d = b.dataset;
  if (d.close !== undefined) { back.classList.remove("open"); return; }
  if (d.tab) { renderSettingsTab(d.tab); return; }
  if (d.logoReset !== undefined) { draftS.school.logo = null; renderSettingsTab("school"); return; }
  if (d.logoUpload !== undefined) {
    const fi = document.createElement("input"); fi.type = "file"; fi.accept = "image/png,image/jpeg,image/svg+xml";
    fi.onchange = () => { const f = fi.files[0]; if (!f) return; if (f.size > 1.5e6) { toast("Logo je příliš velké (max. 1,5 MB).", true); return; }
      const rd = new FileReader(); rd.onload = () => { downscaleLogo(rd.result).then((u) => { draftS.school.logo = u; draftS.school.showLogo = true; renderSettingsTab("school"); }); }; rd.readAsDataURL(f); };
    fi.click(); return;
  }
  if (d.save !== undefined) { S = draftS; if (!saveSettings()) toast("Nastavení se nepodařilo uložit do prohlížeče (příliš velké logo?).", true); back.classList.remove("open"); renderEditor(); toast("Nastavení uloženo."); return; }
  if (d.addYear !== undefined) {
    const years = Object.keys(draftS.rates).map(Number); const ny = String(Math.max(...years) + 1);
    draftS.rates[ny] = { ...JSON.parse(JSON.stringify(draftS.rates[rateYearSel])), year: +ny, source: "Doplňte číslo vyhlášky MPSV pro rok " + ny, note: "Zkopírováno z roku " + rateYearSel + " – ověřte sazby." };
    rateYearSel = ny; renderRatesTab(); return;
  }
  if (d.delYear !== undefined) { if (await confirmDialog({ title: `Odstranit sazby roku ${rateYearSel}?`, text: "Konfigurace sazeb pro tento rok bude odstraněna z nastavení.", ok: "Odstranit", danger: true })) { delete draftS.rates[rateYearSel]; rateYearSel = Object.keys(draftS.rates).sort().pop(); renderRatesTab(); } return; }
  if (d.addEmp) { if (!draftS.employees.includes(d.addEmp)) draftS.employees.push(d.addEmp); renderSettingsTab("emps"); return; }
  if (d.clearRecent !== undefined) { LS.del(KEYS.recent); renderSettingsTab("emps"); return; }
  if (d.restore !== undefined) { back.classList.remove("open"); restoreBackup(); return; }
  if (d.resetSettings !== undefined) { if (await confirmDialog({ title: "Obnovit výchozí nastavení?", text: "Údaje školy, jména, sazby a seznam zaměstnanců se vrátí do výchozího stavu.", ok: "Obnovit", danger: true })) { draftS = defaultSettings(); rateYearSel = Object.keys(draftS.rates).sort().pop(); renderSettingsTab("data"); toast("Výchozí hodnoty načteny – potvrďte Uložit nastavení."); } return; }
  if (d.clearAll !== undefined) { if (await confirmDialog({ title: "Smazat všechna data?", text: "Smaže rozpracovaný doklad, zálohu, nastavení i seznam jmen v tomto prohlížeči. Tuto akci nelze vrátit. Soubory JSON uložené v počítači zůstanou zachovány.", ok: "Smazat vše", danger: true })) { Object.values(KEYS).forEach(LS.del); LS.del("cestak.collapsed"); S = defaultSettings(); D = newDoc(); back.classList.remove("open"); renderEditor(); toast("Všechna data v prohlížeči byla smazána."); } return; }
}
document.addEventListener("change", (e) => { if (e.target.matches("[data-rate-year]")) { rateYearSel = e.target.value; renderRatesTab(); } });

/** Zmenší nahrané logo (max. 600 px na delší straně), aby se vešlo do úložiště prohlížeče. */
function downscaleLogo(url) {
  return new Promise((res) => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 600 / Math.max(im.naturalWidth || 600, im.naturalHeight || 600));
    const cv = document.createElement("canvas"); cv.width = Math.round((im.naturalWidth || 600) * k); cv.height = Math.round((im.naturalHeight || 300) * k);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL("image/png")); }; im.onerror = () => res(url); im.src = url; });
}

/* =========================================================
   Téma, zobrazení, spuštění
   ========================================================= */
function openMenu() {
  const back = $("#dlg");
  back.innerHTML = `<div class="modal"><div class="modal-head"><h2>Akce</h2><button class="btn icon ghost" data-r="0">${ico("x")}</button></div><div class="modal-body"><div class="sheet-actions">
    <button class="btn" data-m="new">${ico("filePlus")}Nový cestovní doklad</button><button class="btn" data-m="dup">${ico("copy")}Duplikovat doklad</button>
    <button class="btn" data-m="save">${ico("save")}Uložit do souboru</button><button class="btn" data-m="load">${ico("upload")}Načíst ze souboru</button>
    <button class="btn" data-m="print">${ico("printer")}Tisk</button><button class="btn primary" data-m="pdf">${ico("download")}Stáhnout PDF</button></div></div></div>`;
  back.classList.add("open");
  back.onclick = (e) => { const b = e.target.closest("[data-m],[data-r]"); if (!b && e.target !== back) return; back.classList.remove("open"); back.innerHTML = ""; const m = b && b.dataset.m; if (!m) return;
    ({ new: newDocument, dup: duplicateDoc, save: saveJSON, load: () => $("#fileIn").click(), print: printDoc, pdf: exportPDF })[m](); };
}
function setTheme(t) { document.documentElement.dataset.theme = t; LS.set(KEYS.theme, t); const b = $("#themeBtn"); if (b) { b.innerHTML = ico(t === "dark" ? "sun" : "moon"); b.title = t === "dark" ? "Světlý režim" : "Tmavý režim"; } }
function setView(v) { document.body.dataset.view = v; $$(".mobile-tabs [data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === v)); if (v === "preview") requestAnimationFrame(applyZoom); }

function init() {
  $("#setBtn").innerHTML = ico("settings");
  setTheme(LS.get(KEYS.theme, null) || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  setView("editor");
  const draft = LS.get(KEYS.draft, null);
  if (draft && draft.doc) { D = normalizeDoc(draft.doc); setTimeout(() => toast(`Obnovena rozpracovaná verze z ${new Date(draft.savedAt).toLocaleString("cs-CZ", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" })}.`), 300); }
  renderEditor();
  const ed = $("#editorInner");
  ed.addEventListener("input", onInput); ed.addEventListener("change", onInput); ed.addEventListener("click", onClick);
  ed.addEventListener("focusout", (e) => { const k = e.target.dataset && e.target.dataset.k; if (k && !touched.has(k)) { touched.add(k); applyValidation(); renderSummary(); } });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "new") newDocument(); if (a === "dup") duplicateDoc(); if (a === "save") saveJSON(); if (a === "load") $("#fileIn").click();
    if (a === "pdf") exportPDF(); if (a === "print") printDoc(); if (a === "settings") openSettings(); if (a === "menu") openMenu();
    if (a === "theme") setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    if (a === "zin") { zoomMode = "manual"; zoom = Math.min(2, Math.round((zoom + 0.1) * 10) / 10); applyZoom(); }
    if (a === "zout") { zoomMode = "manual"; zoom = Math.max(0.3, Math.round((zoom - 0.1) * 10) / 10); applyZoom(); }
    if (a === "fit") { zoomMode = "fit"; applyZoom(); }
    if (a === "a4") { zoomMode = "manual"; zoom = 1; applyZoom(); }
  });
  $$(".mobile-tabs [data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  $("#fileIn").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) loadJSONFile(f); e.target.value = ""; });
  window.addEventListener("resize", () => { if (zoomMode === "fit") applyZoom(); });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveJSON(); }

  // pro automatické testy
  window.__cestak = { get doc() { return D; }, set doc(v) { D = normalizeDoc(v); renderEditor(); }, get calc() { return K; }, renderPreview, buildPages, exportBytes: async () => { await document.fonts.ready; const p = buildPages($("#measure")); const b = await PDFGen.fromPages(p, "test"); return b; }, validate, settings: () => S };
}
document.addEventListener("DOMContentLoaded", init);
})();
